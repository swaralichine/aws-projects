<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            background: #0f172a;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            background: #1e293b;
        }

        h1 {
            margin-bottom: 12px;
            color: #f59e0b;
            font-size: 54px;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            border-radius: 10px;
            color: #0f172a;
            background: #93c5fd;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>404</h1>
        <p>The page you requested could not be found.</p>
        <a href="/">Return to the homepage</a>
    </main>
</body>
</html>
